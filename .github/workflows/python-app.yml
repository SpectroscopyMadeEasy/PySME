name: Python application

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  tag_gate:
    name: Gate release tags to master only
    runs-on: ubuntu-latest
    outputs:
      allow: ${{ steps.gate.outputs.allow }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          fetch-depth: 0

      - id: gate
        shell: bash
        run: |
          set -euo pipefail

          # PR/workflow_dispatch always run. For tag pushes, only allow tags on origin/master.
          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "allow=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin master --depth=1
          if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/master"; then
            echo "allow=true" >> "$GITHUB_OUTPUT"
          else
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping workflow: ${GITHUB_REF} is not on origin/master."
          fi

  classify_changes:
    name: Classify changed files
    needs: [tag_gate]
    if: needs.tag_gate.outputs.allow == 'true'
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: classify
        shell: bash
        run: |
          set -euo pipefail

          # Non-PR events keep previous behavior.
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          code_changed=false
          docs_changed=false

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [[ "$file" == docs/* || "$file" == README.md || "$file" == .readthedocs.yaml ]]; then
              docs_changed=true
            else
              code_changed=true
            fi
          done <<< "$CHANGED_FILES"

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"

  test_pytest:
    name: Pytest on Linux (Python ${{ matrix.python-version }})
    needs: [tag_gate, classify_changes]
    if: needs.tag_gate.outputs.allow == 'true' && github.event_name != 'push' && needs.classify_changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake gfortran libtool

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Cache PySME NLTE data
        uses: actions/cache@v5
        with:
          path: ~/.sme/nlte_grids
          key: pysme-nlte-h-v1-${{ runner.os }}-${{ matrix.python-version }}
          restore-keys: |
            pysme-nlte-h-v1-${{ runner.os }}-

      - name: Cache PySME atmosphere data
        uses: actions/cache@v5
        with:
          path: ~/.sme/atmospheres
          key: pysme-atmospheres-v1-${{ runner.os }}-${{ hashFiles('src/pysme/datafiles_atmospheres.json') }}
          restore-keys: |
            pysme-atmospheres-v1-${{ runner.os }}-

      - name: Cache checked-out SMElib build
        id: smelib-cache
        uses: actions/cache@v5
        with:
          path: |
            smelib/lib
            src/pysme/lib
            src/pysme/share/libsme
            src/pysme/smelib/_smelib*.so
          key: pysme-smelib-source-v1-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('smelib/src/**', 'smelib/pymodule/**', 'src/pysme/smelib/_smelib.cpp', 'src/pysme/smelib/sme_synth_faster.h', 'src/pysme/smelib/build_smelib.py') }}

      - name: Prefetch H NLTE grid
        run: |
          python - <<'PY'
          from pysme.large_file_storage import setup_nlte
          setup_nlte().get("nlte_H_pysme.grd")
          PY

      - name: Prefetch Na NLTE regression grid
        run: |
          python - <<'PY'
          from pysme.large_file_storage import setup_nlte
          setup_nlte().get("nlte_Na_multi_sun.grd")
          PY

      - name: Prefetch Ca NLTE test grid
        run: |
          python - <<'PY'
          from pysme.large_file_storage import setup_nlte
          setup_nlte().get("marcs2012p_t1.0_Ca.grd")
          PY

      - name: Prefetch atmosphere grids
        run: |
          python - <<'PY'
          from pysme.large_file_storage import setup_atmo
          storage = setup_atmo()
          storage.get("marcs2012.sav")
          storage.get("marcs2012p_t2.0.sav")
          storage.get("marcs2014.sav")
          PY

      - name: Build checked-out SMElib
        if: steps.smelib-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd smelib
          ./bootstrap
          ./configure --prefix="$PWD"
          make -j2
          make install
          cd ..
          python - <<'PY'
          from pathlib import Path
          from pysme.smelib.libtools import compile_interface, link_interface_smelib
          link_interface_smelib(str(Path("smelib").resolve()))
          compile_interface()
          PY

      - name: Verify checked-out SMElib
        run: |
          python - <<'PY'
          from pysme.smelib import _smelib
          assert hasattr(_smelib, "GetContinuumOpacityComponents")
          print(_smelib.LibraryVersion())
          PY

      - name: Run pytest
        run: |
          pytest --durations=20

  test_pytest_macos:
    name: Pytest on macOS (Python ${{ matrix.python-version }})
    needs: [tag_gate, classify_changes]
    if: needs.tag_gate.outputs.allow == 'true' && github.event_name != 'push' && needs.classify_changes.outputs.code_changed == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          brew install gcc libtool automake

      - name: Select macOS compilers
        run: |
          set -euo pipefail
          BREW_PREFIX="$(brew --prefix)"
          FVER="$(
            { ls "$BREW_PREFIX"/bin/gfortran-* 2>/dev/null \
                | sed -E 's#.*gfortran-##' \
                | sort -V \
                | tail -n1; } || true
          )"
          if [ -z "${FVER}" ] && [ -x "$BREW_PREFIX/bin/gfortran" ]; then
            FVER="$("$BREW_PREFIX/bin/gfortran" -dumpversion | cut -d. -f1 || true)"
          fi
          [ -n "${FVER}" ] || { echo "No gfortran found"; exit 1; }
          [ -x /usr/bin/clang ] || { echo "No clang found"; exit 1; }
          [ -x /usr/bin/clang++ ] || { echo "No clang++ found"; exit 1; }
          if [ -x "$BREW_PREFIX/bin/gfortran-$FVER" ]; then
            FC_PATH="$BREW_PREFIX/bin/gfortran-$FVER"
          else
            FC_PATH="$BREW_PREFIX/bin/gfortran"
          fi
          GFORTRAN_LIBDIR="$(dirname "$($FC_PATH -print-file-name=libgfortran.dylib)")"
          echo "FC=$FC_PATH" >> $GITHUB_ENV
          echo "CC=/usr/bin/clang" >> $GITHUB_ENV
          echo "CXX=/usr/bin/clang++" >> $GITHUB_ENV
          echo "LDFLAGS=-L$GFORTRAN_LIBDIR -Wl,-rpath,$GFORTRAN_LIBDIR -Wl,-install_name,@rpath/libsme.dylib" >> $GITHUB_ENV
          echo "$(brew --prefix libtool)/bin" >> $GITHUB_PATH

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Cache PySME NLTE data
        uses: actions/cache@v5
        with:
          path: ~/.sme/nlte_grids
          key: pysme-nlte-h-v1-${{ runner.os }}-${{ matrix.python-version }}
          restore-keys: |
            pysme-nlte-h-v1-${{ runner.os }}-

      - name: Cache PySME atmosphere data
        uses: actions/cache@v5
        with:
          path: ~/.sme/atmospheres
          key: pysme-atmospheres-v1-${{ runner.os }}-${{ hashFiles('src/pysme/datafiles_atmospheres.json') }}
          restore-keys: |
            pysme-atmospheres-v1-${{ runner.os }}-

      - name: Cache checked-out SMElib build
        id: smelib-cache
        uses: actions/cache@v5
        with:
          path: |
            smelib/lib
            src/pysme/lib
            src/pysme/share/libsme
            src/pysme/smelib/_smelib*.so
          key: pysme-smelib-source-v1-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('smelib/src/**', 'smelib/pymodule/**', 'src/pysme/smelib/_smelib.cpp', 'src/pysme/smelib/sme_synth_faster.h', 'src/pysme/smelib/build_smelib.py') }}

      - name: Prefetch H NLTE grid
        run: |
          python - <<'PY'
          from pysme.large_file_storage import setup_nlte
          setup_nlte().get("nlte_H_pysme.grd")
          PY

      - name: Prefetch Na NLTE regression grid
        run: |
          python - <<'PY'
          from pysme.large_file_storage import setup_nlte
          setup_nlte().get("nlte_Na_multi_sun.grd")
          PY

      - name: Prefetch Ca NLTE test grid
        run: |
          python - <<'PY'
          from pysme.large_file_storage import setup_nlte
          setup_nlte().get("marcs2012p_t1.0_Ca.grd")
          PY

      - name: Prefetch atmosphere grids
        run: |
          python - <<'PY'
          from pysme.large_file_storage import setup_atmo
          storage = setup_atmo()
          storage.get("marcs2012.sav")
          storage.get("marcs2012p_t2.0.sav")
          storage.get("marcs2014.sav")
          PY

      - name: Build checked-out SMElib
        if: steps.smelib-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd smelib
          ./bootstrap
          ./configure --prefix="$PWD"
          make -j2
          make install
          cd ..
          python - <<'PY'
          from pathlib import Path
          from pysme.smelib.libtools import compile_interface, link_interface_smelib
          link_interface_smelib(str(Path("smelib").resolve()))
          compile_interface()
          PY

      - name: Verify checked-out SMElib
        run: |
          python - <<'PY'
          from pysme.smelib import _smelib
          assert hasattr(_smelib, "GetContinuumOpacityComponents")
          print(_smelib.LibraryVersion())
          PY

      - name: Run pytest
        run: |
          pytest --durations=20

  build_docs:
    name: Build docs
    needs: [tag_gate, classify_changes]
    if: needs.tag_gate.outputs.allow == 'true' && github.event_name != 'push' && needs.classify_changes.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build Sphinx docs
        run: |
          sphinx-build --keep-going -b html docs docs/_build/html

  build_sdist:
    name: Build source distribution
    needs: [tag_gate]
    if: needs.tag_gate.outputs.allow == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [tag_gate]
    if: needs.tag_gate.outputs.allow == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel==2.22"

      - name: Cache cibuildwheel downloads (macOS)
        if: matrix.os == 'macos-14'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/cibuildwheel
          key: cibw-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            cibw-${{ runner.os }}-

      - name: Seed cibuildwheel virtualenv (macOS)
        if: matrix.os == 'macos-14'
        run: |
          set -euo pipefail
          mkdir -p ~/Library/Caches/cibuildwheel
          cp .github/vendor/virtualenv-20.27.1.pyz \
             ~/Library/Caches/cibuildwheel/virtualenv-20.27.1.pyz

      - name: Build wheels (Linux)
        if: matrix.os != 'macos-14'
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD_VERBOSITY: 1

      - name: Build wheels (macOS, first attempt)
        if: matrix.os == 'macos-14'
        id: cibw_macos_first
        continue-on-error: true
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD_VERBOSITY: 1

      - name: Build wheels (macOS, retry once)
        if: matrix.os == 'macos-14' && steps.cibw_macos_first.outcome == 'failure'
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [tag_gate, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: needs.tag_gate.outputs.allow == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    needs: [tag_gate, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: needs.tag_gate.outputs.allow == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  refresh_rtd_latest:
    name: Refresh Read the Docs latest
    needs: [tag_gate, publish, release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: needs.tag_gate.outputs.allow == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      READTHEDOCS_API_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
      RTD_API_ROOT: https://app.readthedocs.org/api/v3/projects/pysme-astro

    steps:
      - name: Wait for release and stable documentation
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${READTHEDOCS_API_TOKEN}" ]]; then
            echo "::error::The READTHEDOCS_API_TOKEN Actions secret is not configured."
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          release_commit="${GITHUB_SHA}"
          tag_ready=false
          stable_ready=false

          for attempt in $(seq 1 40); do
            for version in "$tag" stable; do
              response="$({
                curl --silent --show-error --fail \
                  --connect-timeout 10 --max-time 30 \
                  --header "Authorization: Token ${READTHEDOCS_API_TOKEN}" \
                  "${RTD_API_ROOT}/versions/${version}/builds/?limit=1"
              } || true)"

              commit="$(jq -r '.results[0].commit // empty' <<<"$response")"
              state="$(jq -r '.results[0].state.code // empty' <<<"$response")"
              success="$(jq -r '.results[0].success // empty' <<<"$response")"

              if [[ "$commit" == "$release_commit" && "$state" == "finished" ]]; then
                if [[ "$success" != "true" ]]; then
                  echo "::error::Read the Docs ${version} build failed for ${release_commit}."
                  exit 1
                fi
                if [[ "$version" == "$tag" ]]; then
                  tag_ready=true
                else
                  stable_ready=true
                fi
              fi
            done

            if [[ "$tag_ready" == "true" && "$stable_ready" == "true" ]]; then
              echo "Read the Docs ${tag} and stable builds succeeded for ${release_commit}."
              break
            fi

            if [[ "$attempt" == "40" ]]; then
              echo "::error::Timed out waiting for Read the Docs ${tag} and stable builds."
              exit 1
            fi

            echo "Waiting for Read the Docs release builds (${attempt}/40): tag=${tag_ready}, stable=${stable_ready}"
            sleep 30
          done

      - name: Trigger latest documentation build
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 30 \
            --request POST \
            --header "Authorization: Token ${READTHEDOCS_API_TOKEN}" \
            "${RTD_API_ROOT}/versions/latest/builds/"
