name: Flag changes to existing tests

# Adds the label "tests-modified" when a pull request modifies, renames or deletes an existing file under test/.
# New test files do not trigger it. The workflow only reads the PR file list through the API and never runs PR code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0 (pinned)
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100
            });
            const touched = files.filter(f =>
              ((f.filename.startsWith('test/') && ['modified', 'removed', 'renamed', 'changed'].includes(f.status)) ||
               (f.status === 'renamed' && f.previous_filename && f.previous_filename.startsWith('test/'))));
            const label = 'tests-modified';
            const has = pr.labels.some(l => l.name === label);
            if (touched.length > 0 && !has) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, labels: [label]
              });
            } else if (touched.length === 0 && has) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, name: label
              });
            }
            core.summary.addRaw(`Existing test files changed: ${touched.map(f => f.filename).join(', ') || 'none'}`).write();
